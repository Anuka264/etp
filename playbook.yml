---
- name: Apache Config Playbook
  hosts: localhost
  connection: local
  become: false
  tasks:
    - name: Copy vhost file
      ansible.builtin.copy:
        src: custom_vhost.conf
        dest: /etc/apache2/conf-available/custom_vhost.conf
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      ansible.builtin.debug:
        msg: "Simulating Apache Restart..."